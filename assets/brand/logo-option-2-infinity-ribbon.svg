<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c2Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="45%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="c2Amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="w2Cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="w2Amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- EMBLEM: Option 2 - Interlocking Infinity Cloud Ribbon -->
  <g transform="translate(20, 16)">
    <!-- Left / Upper Cyan Ribbon forming Cloud Dome & Infinity Loop -->
    <path d="M 46 108
             C 21 108, 4 91, 4 67
             C 4 45, 20 28, 42 27
             C 51 11, 69 2, 89 2
             C 116 2, 138 21, 142 47
             L 120 47
             C 116 32, 104 22, 89 22
             C 73 22, 60 31, 55 45
             L 44 45
             C 31 45, 23 54, 23 67
             C 23 80, 32 89, 46 89
             L 98 89
             L 114 108
             Z"
          fill="url(#c2Cyan)" />

    <!-- Right / Lower Amber Ribbon Interlocking as Cloud Base & Ascent Loop -->
    <path d="M 92 38
             L 76 57
             L 144 57
             C 157 57, 166 66, 166 78
             C 166 90, 157 99, 144 99
             L 122 99
             L 106 79
             L 68 79
             L 84 118
             L 144 118
             C 168 118, 186 101, 186 78
             C 186 55, 168 38, 144 38
             Z"
          fill="url(#c2Amber)" />

    <!-- Central Convergence Spark / Node -->
    <circle cx="96" cy="68" r="5" fill="#FFFFFF" />
    <circle cx="96" cy="68" r="10" stroke="#38BDF8" stroke-width="1.5" opacity="0.5" />
  </g>

  <!-- WORDMARK -->
  <text x="232" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.8">
    <tspan fill="url(#w2Cyan)">Sky</tspan><tspan fill="url(#w2Amber)">Kloud</tspan>
  </text>
  <text x="236" y="118" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="4.2" fill="#94A3B8">
    ENTERPRISE CLOUD ARCHITECTURE
  </text>
</svg>
