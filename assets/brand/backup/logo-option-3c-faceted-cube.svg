<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c3cTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="c3cLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="c3cRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- EMBLEM: Option 3C - Precision 3D Isometric Block Cube ('S' Left Face + 'K' Right Face + Cloud Crown) -->
  <g transform="translate(24, 11)">
    <!-- Top Isometric Diamond Crown -->
    <polygon points="70,8 124,32 70,54 16,32" fill="url(#c3cTop)" />
    <polygon points="70,17 100,31 70,44 40,31" fill="#070D1E" />
    <polygon points="70,23 85,30 70,37 55,30" fill="#FBBF24" />

    <!-- Left 3D Isometric Face: Exact 12px Grid Block 'S' -->
    <polygon points="16,40 66,60 66,72 30,58 30,70 66,84 66,120 16,100 16,88 52,102 52,90 16,76"
             fill="url(#c3cLeft)" />

    <!-- Right 3D Isometric Face: Exact 12px Grid Block 'K' -->
    <polygon points="74,60 88,54 88,114 74,120" fill="url(#c3cRight)" />
    <polygon points="86,78 124,40 124,55 86,91" fill="#FBBF24" />
    <polygon points="94,81 124,86 124,100 86,91" fill="#D97706" />
  </g>

  <!-- WORDMARK -->
  <text x="192" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.8">
    <tspan fill="#0284C7">Sky</tspan><tspan fill="#F59E0B">Kloud</tspan>
  </text>
  <text x="196" y="118" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="4.5" fill="#94A3B8">
    STRATEGIC ADVISORY PARTNERS
  </text>
</svg>
