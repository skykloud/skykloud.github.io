<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c6Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="c6Amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Option 6: Minimalist Executive Wordmark with Integrated Apex Slash & Micro-Emblem -->
  <g transform="translate(22, 26)">
    <!-- Compact Rounded Square App/Executive Badge -->
    <rect x="0" y="6" width="84" height="84" rx="20" fill="#0F172A" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />
    <!-- Dual Intersecting Cloud Pills inside Badge -->
    <path d="M 18 58 C 18 44, 29 34, 42 34 C 52 34, 60 40, 63 48 C 63 60, 54 66, 42 66 L 24 66 C 20 66, 18 62, 18 58 Z" fill="url(#c6Cyan)" />
    <path d="M 38 36 C 42 26, 52 22, 61 26 C 68 30, 71 39, 68 47 L 54 47 C 50 39, 44 36, 38 36 Z" fill="url(#c6Amber)" />
    <circle cx="36" cy="52" r="3" fill="#FFFFFF" />
    <line x1="36" y1="52" x2="52" y2="52" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- Editorial Wordmark with Precision Divider -->
  <text x="128" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">
    <tspan fill="#F8FAFC">Sky</tspan><tspan fill="url(#c6Cyan)">Kloud</tspan>
  </text>
  <!-- Amber Apex Dot on the right -->
  <circle cx="448" cy="78" r="7" fill="url(#c6Amber)" />

  <!-- Bottom Rule & Tagline -->
  <line x1="132" y1="106" x2="455" y2="106" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3" />
  <text x="132" y="123" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" letter-spacing="4.8" fill="#F59E0B">
    PITTSBURGH · GLOBAL ADVISORY
  </text>
</svg>
