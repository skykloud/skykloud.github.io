<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="c3bCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="c3bAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="c3bShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15223E" />
      <stop offset="100%" stop-color="#080F20" />
    </linearGradient>
  </defs>

  <!-- EMBLEM: Option 3B - Architectural Shield Crest with Cloud Arc + Interlocking SK -->
  <g transform="translate(24, 11)">
    <!-- Beveled Executive Shield -->
    <path d="M 70 4 L 128 24 L 128 74 C 128 102, 102 120, 70 128 C 38 120, 12 102, 12 74 L 12 24 Z"
          fill="url(#c3bShield)" stroke="#38BDF8" stroke-width="2.2" stroke-opacity="0.55" />
    <path d="M 70 11 L 120 29 L 120 73 C 120 97, 97 113, 70 120 C 43 113, 20 97, 20 73 L 20 29 Z"
          fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.12" />

    <!-- Top Cloud Canopy Arc -->
    <path d="M 42 34 C 48 24, 58 19, 70 19 C 82 19, 92 24, 98 34"
          fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.85" />
    <circle cx="70" cy="19" r="3.5" fill="#FBBF24" />

    <!-- Smooth Geometric 'S' Curve (Left) -->
    <path d="M 62 42 L 40 42 C 33 42, 29 46, 29 53 C 29 59, 33 63, 40 65 L 54 68 C 61 70, 65 74, 65 81 C 65 88, 60 93, 52 93 L 31 93"
          fill="none" stroke="url(#c3bCyan)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Smooth Geometric 'K' Chevron (Right) -->
    <path d="M 79 41 L 79 94"
          fill="none" stroke="url(#c3bAmber)" stroke-width="10" stroke-linecap="round" />
    <path d="M 109 42 L 83 66 L 109 93"
          fill="none" stroke="url(#c3bAmber)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- WORDMARK -->
  <text x="192" y="92" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.8">
    <tspan fill="#0284C7">Sky</tspan><tspan fill="#F59E0B">Kloud</tspan>
  </text>
  <text x="196" y="118" font-family="'IBM Plex Mono', monospace" font-size="11.5" font-weight="600" letter-spacing="4.5" fill="#94A3B8">
    STRATEGIC ADVISORY PARTNERS
  </text>
</svg>
