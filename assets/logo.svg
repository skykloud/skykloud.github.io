<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan gradient for Cloud 1 -->
    <linearGradient id="skCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Amber gradient for Cloud 2 -->
    <linearGradient id="skAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Text gradient for Sky -->
    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Text gradient for Kloud -->
    <linearGradient id="textAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle inner drop shadow -->
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ICON EMBLEM GROUP -->
  <g transform="translate(10, 10)" filter="url(#skGlow)">
    <!-- Back Amber Cloud (Right Cloud) -->
    <path d="M 95 38 
             C 95 18, 115 5, 138 8 
             C 155 10, 168 25, 170 42 
             C 188 44, 202 58, 202 76 
             C 202 96, 186 112, 166 112 
             L 105 112 
             C 90 112, 80 102, 78 88 
             C 76 68, 86 48, 95 38 Z" 
          fill="url(#skAmberGrad)" />

    <!-- Amber Cloud Server Data Tracks -->
    <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9">
      <line x1="125" y1="62" x2="175" y2="62" />
      <circle cx="178" cy="62" r="3" fill="#ffffff" stroke="none" />
      <line x1="125" y1="76" x2="170" y2="76" />
      <circle cx="173" cy="76" r="3" fill="#ffffff" stroke="none" />
      <line x1="125" y1="90" x2="175" y2="90" />
      <circle cx="178" cy="90" r="3" fill="#ffffff" stroke="none" />
    </g>

    <!-- Front Cyan Cloud (Left Cloud) -->
    <path d="M 45 45 
             C 45 22, 68 8, 90 12 
             C 106 15, 118 28, 120 45 
             C 136 48, 148 62, 148 78 
             C 148 97, 133 112, 114 112 
             L 38 112 
             C 18 112, 5 96, 5 76 
             C 5 58, 18 45, 34 44 
             C 36 34, 40 40, 45 45 Z" 
          fill="url(#skCyanGrad)" />

    <!-- Cyan Cloud Digital Circuit Traces -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
      <!-- Central stem -->
      <line x1="72" y1="105" x2="72" y2="52" />
      <circle cx="72" cy="49" r="3" fill="#ffffff" stroke="none" />

      <!-- Left branch -->
      <path d="M 72 82 L 56 68 L 56 58" />
      <circle cx="56" cy="55" r="3" fill="#ffffff" stroke="none" />

      <!-- Far left branch -->
      <path d="M 56 78 L 42 78 L 42 66" />
      <circle cx="42" cy="63" r="3" fill="#ffffff" stroke="none" />

      <!-- Right branch -->
      <path d="M 72 74 L 88 64 L 88 56" />
      <circle cx="88" cy="53" r="3" fill="#ffffff" stroke="none" />

      <!-- Far right branch -->
      <path d="M 88 72 L 102 72 L 102 62" />
      <circle cx="102" cy="59" r="3" fill="#ffffff" stroke="none" />
    </g>

    <!-- Subtle bottom reflection highlight -->
    <path d="M 25 106 C 50 112, 100 112, 125 106" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.3" />
  </g>

  <!-- WORDMARK: "SkyKloud" -->
  <text x="235" y="88" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    <tspan fill="url(#textCyan)">Sky</tspan><tspan fill="url(#textAmber)">Kloud</tspan>
  </text>

  <!-- SUBTITLE: "ADVISORY & TRANSFORMATION" -->
  <text x="238" y="112" font-family="'IBM Plex Mono', 'Plus Jakarta Sans', monospace" font-size="12" font-weight="600" letter-spacing="4" fill="#94A3B8">
    ADVISORY &amp; TRANSFORMATION
  </text>
</svg>
